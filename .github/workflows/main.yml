name: Fix Hero Background Position

on:
  workflow_dispatch:

  jobs:
    fix-hero:
        runs-on: ubuntu-latest
            permissions:
                  contents: write
                      steps:
                            - uses: actions/checkout@v4

                                  - name: Add fix.css link to index.html
                                          run: |
                                                    sed -i 's|<head>|<head><link rel="stylesheet" href="fix.css">|' doutor-orquidea/index.html
                                                              echo "Done"

                                                                    - name: Commit and push
                                                                            run: |
                                                                                      git config user.name 'github-actions[bot]'
                                                                                                git config user.email 'github-actions[bot]@users.noreply.github.com'
                                                                                                          git add doutor-orquidea/index.html
                                                                                                                    git diff --staged --quiet || git commit -m 'Fix: add fix.css link to hero'
                                                                                                                              git push
